[fmt]
line_length = 120
tab_width = 2
bracket_spacing = false
int_types = 'long'
quote_style = 'single'
number_underscore = 'thousands'
multiline_func_header = 'params_first_multi'
sort_imports = true

[profile.default]
solc_version = '0.8.30'
evm_version = 'prague'
libs = ['node_modules']
optimizer_runs = 10_000
via_ir = true
ignored_warnings_from = ["node_modules/@openzeppelin/contracts/proxy/utils/Initializable.sol"]
fs_permissions = [{ access = 'read-write', path = './deployments' }]

[profile.verify]
ffi = true
fs_permissions = [{ access = 'read', path = './deployments' }]

[profile.optimized]
via_ir = true
out = 'out-via-ir'

[profile.test]
via_ir = true
out = 'out-via-ir'

[profile.docs]
src = 'src/interfaces/'

[fuzz]
runs = 1000

[rpc_endpoints]
# Throttle + retry fork RPC (CI integration tests); alias used by `--fork-url mainnet`.
mainnet = { endpoint = "${MAINNET_RPC}", retries = 10, retry_backoff = 2000, compute_units_per_second = 400 }
sepolia = { endpoint = "${SEPOLIA_RPC}", retries = 5, retry_backoff = 1000 }
arbitrum = { endpoint = "${ARBITRUM_RPC}", retries = 5, retry_backoff = 1000 }

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
arbitrum = { key = "${ETHERSCAN_API_KEY}" }
