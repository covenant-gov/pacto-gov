name: Coverage Check

on:
  pull_request:

env:
  COVERAGE_SENSITIVITY_PERCENT: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  base-coverage:
    name: Generate base coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base-coverage: ${{ steps.export-base.outputs.base-coverage }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: install-tools
        uses: ./.github/workflows/install-tools

      - name: Restore base coverage cache
        id: cache-base
        uses: actions/cache@v4
        with:
          path: total-coverage.txt
          # v2: Foundry LCOV needs ignore-errors on newer ubuntu lcov; prior cache could store a bad base %.
          key: coverage-base-v2-${{ github.event.pull_request.base.sha }}

      - name: Run base branch coverage
        if: steps.cache-base.outputs.cache-hit != 'true'
        run: pnpm coverage

      - name: Setup LCOV (for base coverage summary)
        if: steps.cache-base.outputs.cache-hit != 'true'
        uses: hrishikesh-kadam/setup-lcov@v1

      - name: Configure LCOV for Foundry traces
        if: steps.cache-base.outputs.cache-hit != 'true'
        run: |
          printf '%s\n' \
            'check_data_consistency = 0' \
            'ignore_errors = inconsistent,corrupt,deprecated' \
            > "$HOME/.lcovrc"

      - name: Prepare cached base total coverage
        if: steps.cache-base.outputs.cache-hit != 'true'
        run: |
          total_coverage=$(lcov --summary lcov.info --ignore-errors inconsistent,corrupt,deprecated \
            | awk '/lines\.+:/ {print $2}' | tr -d '%')
          echo "$total_coverage" > total-coverage.txt

      - name: Export base coverage output
        id: export-base
        run: |
          base=0
          if [ -f total-coverage.txt ]; then
            base=$(cat total-coverage.txt | tr -d '%')
          fi
          echo "base-coverage=$base" >> "$GITHUB_OUTPUT"

  check-coverage:
    name: Check PR coverage
    runs-on: ubuntu-latest
    needs: base-coverage
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      # Same pin as base-coverage; floating `stable` reports different LCOV hits than the pinned toolchain.
      - name: install-tools
        uses: ./.github/workflows/install-tools

      - name: Run current branch coverage
        run: pnpm coverage

      - name: Setup LCOV (for current PR coverage summary)
        uses: hrishikesh-kadam/setup-lcov@v1

      # report-lcov only passes ignore-errors to genhtml/merge; summarize/list still call bare lcov.
      - name: Configure LCOV for Foundry traces
        run: |
          printf '%s\n' \
            'check_data_consistency = 0' \
            'ignore_errors = inconsistent,corrupt,deprecated' \
            > "$HOME/.lcovrc"

      - name: Compute minimum coverage threshold
        id: compute-min
        run: |
          base="${{ needs.base-coverage.outputs.base-coverage }}"
          sens="${{ env.COVERAGE_SENSITIVITY_PERCENT }}"
          [ -z "$base" ] && base=0
          [ -z "$sens" ] && sens=0
          min=$(awk -v b="$base" -v s="$sens" 'BEGIN{v=b-s; if (v<0) v=0; printf "%.2f", v}')
          echo "minimum=$min" >> "$GITHUB_OUTPUT"

      # Updates the comment on every PR push (skipped for fork PRs - token cannot comment)
      - name: Create a comment on the PR with the current branch coverage
        id: new-coverage
        if: hashFiles('lcov.info') != '' && github.event.pull_request.head.repo.full_name == github.repository
        uses: zgosalvez/github-actions-report-lcov@v5
        with:
          coverage-files: lcov.info
          github-token: ${{ github.token }}
          update-comment: true
          minimum-coverage: ${{ steps.compute-min.outputs.minimum }}
          genhtml-ignore-errors: inconsistent,corrupt
