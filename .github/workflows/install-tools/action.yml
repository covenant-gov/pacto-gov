name: Install tools common to all our actions
description: Installs pinned Foundry, pnpm, Node.js, and project dependencies for CI jobs.

runs:
  using: composite
  steps:
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        # Pin so `forge fmt --check` matches developer installs (floating `stable` changes formatter output).
        version: v1.4.1

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
