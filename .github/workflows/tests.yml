name: CI

on: [push]

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x

      - name: Require SHA-pinned third-party Actions
        run: node scripts/check-actions-pinned.mjs

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: install-tools
        uses: ./.github/actions/install-tools

      - name: Run tests
        shell: bash
        run: pnpm test:unit

  e2e-tests:
    name: Run E2E tests
    runs-on: ubuntu-latest
    environment: e2e
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: install-tools
        uses: ./.github/actions/install-tools

      - name: Cache Foundry fork RPC
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            cache
            ~/.foundry/cache
          key: foundry-rpc-v1-${{ hashFiles('script/Constants.sol', 'foundry.toml') }}
          restore-keys: |
            foundry-rpc-v1-

      - name: Run E2E tests
        env:
          MAINNET_RPC: ${{ secrets.MAINNET_RPC || vars.MAINNET_RPC }}
          SEPOLIA_RPC: ${{ secrets.SEPOLIA_RPC || vars.SEPOLIA_RPC }}
        run: pnpm test:integration

  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: wagoid/commitlint-github-action@9763196e10f27aef304c9b8b660d31d97fce0f99 # v5.5.1

      - name: install-tools
        uses: ./.github/actions/install-tools

      - name: Run Forge formatter and Solhint
        run: pnpm lint:check

      - name: Install and run Bulloak
        uses: smol-ninja/bulloak-toolchain@d4e00e1dc5673d3e6731ac37b8cdbb3f451863be # v2.2.0
        with:
          test-dir: 'test/unit'
